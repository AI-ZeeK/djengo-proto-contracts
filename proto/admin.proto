// ============================================================================
// DATABASE BACKUPS
// ============================================================================

message DatabaseBackup {
  string backup_id = 1;
  string file_name = 2;
  string status = 3;   // RUNNING | SUCCESS | FAILED
  string trigger = 4;  // SCHEDULED | MANUAL
  optional string triggered_by = 5;
  optional string size_bytes = 6; // string: int64 exceeds JS safe integers in JSON
  repeated string databases = 7;
  bool stored_locally = 8;
  optional string remote_key = 9;
  optional string error = 10;
  string started_at = 11;
  optional string finished_at = 12;
  optional string triggered_by_email = 13;
}

message TriggerDatabaseBackupRequest {
  optional string triggered_by = 1; // admin user_id
}

message DatabaseBackupResponse {
  bool success = 1;
  string message = 2;
  optional DatabaseBackup backup = 3;
}

message ListDatabaseBackupsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListDatabaseBackupsResponse {
  bool success = 1;
  repeated DatabaseBackup backups = 2;
  int32 total = 3;
  int32 page = 4;
  int32 page_size = 5;
  bool remote_configured = 6;
  optional string schedule = 7;
  int32 local_retention = 8;
}

message DeleteDatabaseBackupRequest {
  string backup_id = 1;
}

message DeleteDatabaseBackupResponse {
  bool success = 1;
  string message = 2;
}

message DownloadDatabaseBackupRequest {
  string backup_id = 1;
}

message DatabaseBackupChunk {
  bytes data = 1;
  string file_name = 2;  // set on the first chunk
  string size_bytes = 3; // set on the first chunk
}

// ── Outreach ─────────────────────────────────────────────────────────────
// Find hospitality businesses, review them, push approved ones to a cold-email
// tool (Instantly) and give campaign signups a longer trial via a code.

service OutreachService {
  /// Google Places search for one city and business type; new leads only.
  rpc DiscoverLeads(DiscoverLeadsRequest) returns (DiscoverLeadsResponse);
  /// Look for a contact email on each lead's own website.
  rpc FindLeadEmails(LeadIdsRequest) returns (OutreachLeadsResponse);
  rpc ListLeads(ListOutreachLeadsRequest) returns (OutreachLeadsResponse);
  rpc CreateLead(CreateOutreachLeadRequest) returns (OutreachLeadResponse);
  rpc UpdateLead(UpdateOutreachLeadRequest) returns (OutreachLeadResponse);
  /// Approve or reject leads before they can be emailed.
  rpc ReviewLeads(ReviewOutreachLeadsRequest) returns (OutreachLeadsResponse);

  rpc ListCampaigns(ListOutreachCampaignsRequest) returns (OutreachCampaignsResponse);
  rpc CreateCampaign(UpsertOutreachCampaignRequest) returns (OutreachCampaignResponse);
  rpc UpdateCampaign(UpsertOutreachCampaignRequest) returns (OutreachCampaignResponse);
  /// Send approved leads to the campaign in the cold-email tool.
  rpc PushCampaignLeads(PushCampaignLeadsRequest) returns (PushCampaignLeadsResponse);
  /// Webhook from the cold-email tool (opens, replies, unsubscribes, bounces…).
  rpc RecordProviderEvent(ProviderEventRequest) returns (ProviderEventResponse);
  /// Campaigns sent from the business mailbox: is it set up, how much went out today.
  rpc GetMailboxStatus(MailboxStatusRequest) returns (MailboxStatusResponse);
  /// Render a campaign's email for one lead, and optionally send it as a test.
  rpc PreviewCampaignEmail(PreviewCampaignEmailRequest) returns (PreviewCampaignEmailResponse);
  /// Public: the unsubscribe link in mailbox campaign emails.
  rpc Unsubscribe(OutreachUnsubscribeRequest) returns (OutreachUnsubscribeResponse);

  /// Public: what a campaign code offers (landing page).
  rpc CheckTrialCode(TrialCodeRequest) returns (TrialCodeResponse);
  /// A new organization claims a campaign code; one code per organization.
  rpc RedeemTrialCode(RedeemTrialCodeRequest) returns (TrialCodeResponse);

  rpc ListSuppressions(ListSuppressionsRequest) returns (SuppressionsResponse);
  rpc AddSuppression(AddSuppressionRequest) returns (SuppressionsResponse);
  rpc RemoveSuppression(RemoveSuppressionRequest) returns (SuppressionsResponse);

  /// Cities outreach can search in; any city can be added (geocoded with OpenStreetMap).
  rpc ListCities(ListOutreachCitiesRequest) returns (OutreachCitiesResponse);
  rpc AddCity(AddOutreachCityRequest) returns (OutreachCitiesResponse);
  rpc UpdateCity(UpdateOutreachCityRequest) returns (OutreachCitiesResponse);
}

message OutreachLead {
  string lead_id = 1;
  /// GOOGLE_PLACES | OPENSTREETMAP | MANUAL
  string source = 2;
  optional string place_id = 3;
  string name = 4;
  /// HOTEL | SHORT_LET | RESTAURANT | HOSPITAL | ESTATE
  string category = 5;
  /// ISO country code of one of the target cities
  string country = 6;
  string city = 7;
  optional string address = 8;
  optional string phone = 9;
  optional string website = 10;
  optional string email = 11;
  /// WEBSITE | MAP (listed on OpenStreetMap) | MANUAL
  optional string email_source = 12;
  repeated string email_candidates = 13;
  optional double rating = 14;
  optional int32 review_count = 15;
  /// NEW | APPROVED | REJECTED | QUEUED | CONTACTED | REPLIED | INTERESTED | SIGNED_UP | UNSUBSCRIBED | BOUNCED
  string status = 16;
  optional string reject_reason = 17;
  optional string notes = 18;
  optional string campaign_id = 19;
  optional string contacted_at = 20;
  optional string opened_at = 21;
  optional string clicked_at = 22;
  optional string replied_at = 23;
  optional string reviewed_at = 24;
  optional string enriched_at = 25;
  optional string converted_org_id = 26;
  string created_at = 27;
  /// On the do-not-contact list.
  bool suppressed = 28;
}

message DiscoverLeadsRequest {
  string country = 1;
  string city = 2;
  string category = 3;
  /// Optional extra words, e.g. "boutique" or "Wuse 2".
  optional string query = 4;
  /// Up to 60 per search (Google's limit).
  int32 max_results = 5;
  string requested_by = 6;
  /// OPENSTREETMAP (free, no key) | GOOGLE_PLACES (needs GOOGLE_PLACES_API_KEY).
  optional string source = 7;
}

message DiscoverLeadsResponse {
  int32 found = 1;
  int32 created = 2;
  int32 already_known = 3;
  repeated OutreachLead leads = 4;
}

message LeadIdsRequest {
  repeated string lead_ids = 1;
}

message ListOutreachLeadsRequest {
  optional string status = 1;
  optional string country = 2;
  optional string city = 3;
  optional string category = 4;
  optional string search = 5;
  optional string campaign_id = 6;
  /// Only leads with / without an email.
  optional bool has_email = 7;
  int32 page = 8;
  int32 page_size = 9;
}

message OutreachLeadsResponse {
  repeated OutreachLead leads = 1;
  int32 total = 2;
}

message OutreachLeadResponse {
  OutreachLead lead = 1;
}

message CreateOutreachLeadRequest {
  string name = 1;
  string category = 2;
  string country = 3;
  string city = 4;
  optional string address = 5;
  optional string phone = 6;
  optional string website = 7;
  optional string email = 8;
  optional string notes = 9;
  string created_by = 10;
}

message UpdateOutreachLeadRequest {
  string lead_id = 1;
  optional string name = 2;
  optional string email = 3;
  optional string phone = 4;
  optional string website = 5;
  optional string notes = 6;
  optional string category = 7;
}

message ReviewOutreachLeadsRequest {
  repeated string lead_ids = 1;
  /// APPROVE | REJECT | RESET (back to NEW)
  string decision = 2;
  optional string reason = 3;
  string reviewer_id = 4;
}

message OutreachCampaign {
  string campaign_id = 1;
  string name = 2;
  string code = 3;
  string country = 4;
  string city = 5;
  string category = 6;
  int32 trial_days = 7;
  /// DRAFT | ACTIVE | PAUSED | ENDED
  string status = 8;
  string provider = 9;
  optional string provider_campaign_id = 10;
  optional string expires_at = 11;
  string signup_url = 12;
  string created_at = 13;
  int32 leads = 14;
  int32 contacted = 15;
  int32 opened = 16;
  int32 clicked = 17;
  int32 replied = 18;
  int32 signed_up = 19;
  int32 unsubscribed = 20;
  int32 bounced = 21;
  int32 redemptions = 22;
  /// MAILBOX campaigns: the emails, with {{merge_tags}}.
  optional string subject = 23;
  optional string body = 24;
  /// Sent once, follow_up_days after the first email, unless they replied. Empty = no follow-up.
  optional string follow_up_body = 25;
  int32 follow_up_days = 26;
  /// Waiting to be sent from the mailbox.
  int32 queued = 27;
}

message ListOutreachCampaignsRequest {
  optional string status = 1;
}

message OutreachCampaignsResponse {
  repeated OutreachCampaign campaigns = 1;
}

message OutreachCampaignResponse {
  OutreachCampaign campaign = 1;
}

message UpsertOutreachCampaignRequest {
  /// Set on update.
  optional string campaign_id = 1;
  optional string name = 2;
  optional string country = 3;
  optional string city = 4;
  optional string category = 5;
  optional int32 trial_days = 6;
  optional string status = 7;
  /// The campaign's ID in Instantly (create the sequence there, paste the ID here).
  optional string provider_campaign_id = 8;
  optional string expires_at = 9;
  string actor_id = 10;
  /// MAILBOX (the business mailbox, default) | INSTANTLY
  optional string provider = 11;
  optional string subject = 12;
  optional string body = 13;
  optional string follow_up_body = 14;
  optional int32 follow_up_days = 15;
}

message MailboxStatusRequest {}

message MailboxStatusResponse {
  bool configured = 1;
  optional string from = 2;
  /// Settings still to set on admin-service.
  repeated string missing = 3;
  int32 sent_today = 4;
  int32 daily_limit = 5;
  /// Replies, bounces and unsubscribe replies are read from the inbox (IMAP).
  bool replies_tracked = 6;
  /// Local hours in each lead's city, e.g. "8-17".
  string send_hours = 7;
  int32 queued = 8;
  optional string last_error = 9;
  optional string last_inbox_check_at = 10;
}

message PreviewCampaignEmailRequest {
  string campaign_id = 1;
  /// Defaults to a sample business.
  optional string lead_id = 2;
  /// 1 = first email (default), 2 = follow-up.
  optional int32 step = 3;
  /// Send it to this address as a test (not counted, not tracked).
  optional string send_test_to = 4;
}

message PreviewCampaignEmailResponse {
  string to = 1;
  string subject = 2;
  string text = 3;
  optional string sent_to = 4;
}

message OutreachUnsubscribeRequest {
  string token = 1;
}

message OutreachUnsubscribeResponse {
  bool ok = 1;
  optional string email = 2;
}

message PushCampaignLeadsRequest {
  string campaign_id = 1;
  /// Empty = every approved lead with an email matching the campaign's city and type.
  repeated string lead_ids = 2;
}

message PushCampaignLeadsResponse {
  int32 sent = 1;
  int32 uploaded = 2;
  int32 skipped_suppressed = 3;
  int32 skipped_no_email = 4;
  int32 skipped_by_provider = 5;
  optional string message = 6;
}

message ProviderEventRequest {
  /// INSTANTLY
  string provider = 1;
  /// The raw webhook body.
  string payload_json = 2;
}

message ProviderEventResponse {
  bool matched = 1;
  optional string lead_id = 2;
}

message TrialCodeRequest {
  string code = 1;
}

message RedeemTrialCodeRequest {
  string code = 1;
  string organization_id = 2;
  string redeemed_by = 3;
}

message TrialCodeResponse {
  bool valid = 1;
  int32 trial_days = 2;
  optional string campaign_id = 3;
  optional string city = 4;
  optional string country = 5;
  optional string category = 6;
  optional string expires_at = 7;
  /// Why it can't be used (expired, ended, already used…).
  optional string reason = 8;
}

message OutreachSuppression {
  string suppression_id = 1;
  /// An email address, or "@domain.com" for a whole domain.
  string value = 2;
  /// UNSUBSCRIBED | BOUNCED | REQUESTED | MANUAL
  string reason = 3;
  optional string note = 4;
  string created_at = 5;
}

message ListSuppressionsRequest {
  optional string search = 1;
}

message AddSuppressionRequest {
  string value = 1;
  string reason = 2;
  optional string note = 3;
}

message RemoveSuppressionRequest {
  string suppression_id = 1;
}

message SuppressionsResponse {
  repeated OutreachSuppression suppressions = 1;
}

message OutreachCity {
  string city_id = 1;
  string name = 2;
  /// ISO 3166-1 alpha-2
  string country = 3;
  string country_name = 4;
  /// Three letters used in campaign codes
  string short = 5;
  double lat = 6;
  double lng = 7;
  int32 radius_meters = 8;
  bool active = 9;
  int32 leads = 10;
}

message ListOutreachCitiesRequest {
  /// Include switched-off cities
  bool include_inactive = 1;
}

message AddOutreachCityRequest {
  string name = 1;
  /// Country name or ISO code, e.g. "Portugal" or "PT"
  string country = 2;
  optional string short = 3;
  optional int32 radius_meters = 4;
  string created_by = 5;
}

message UpdateOutreachCityRequest {
  string city_id = 1;
  optional bool active = 2;
  optional int32 radius_meters = 3;
}

message OutreachCitiesResponse {
  repeated OutreachCity cities = 1;
  /// The city just added or changed
  optional OutreachCity city = 2;
}

// ============================================================================
// CAREERS — the signed-in admin's own job search
// ============================================================================

service CareersService {
  /// Whether Claude and the mailbox are set up, and today's send count.
  rpc GetStatus(CareerAdminRequest) returns (CareersStatusResponse);

  rpc GetProfile(CareerAdminRequest) returns (CareerProfileResponse);
  rpc SaveProfile(SaveCareerProfileRequest) returns (CareerProfileResponse);
  /// Read an uploaded resume (PDF, DOCX text or plain text) into the profile.
  rpc ImportResume(ImportResumeRequest) returns (CareerProfileResponse);

  /// Pull new software roles from the job boards and watched company pages.
  rpc SyncJobs(SyncJobsRequest) returns (SyncJobsResponse);
  rpc ListJobs(ListCareerJobsRequest) returns (CareerJobsResponse);
  rpc GetJob(CareerJobRequest) returns (CareerJobResponse);
  /// Save, dismiss or reset jobs.
  rpc SetJobStatus(SetCareerJobStatusRequest) returns (CareerJobsResponse);
  /// Claude reads each job against the resume: score, strengths, gaps.
  rpc AnalyzeFit(AnalyzeFitRequest) returns (CareerJobsResponse);
  /// Companies with open software roles, grouped from the jobs.
  rpc ListCompanies(ListHiringCompaniesRequest) returns (HiringCompaniesResponse);

  /// Tailored resume, cover letter and email for one job; saved as a draft.
  rpc DraftApplication(DraftApplicationRequest) returns (CareerApplicationResponse);
  rpc ListApplications(ListCareerApplicationsRequest) returns (CareerApplicationsResponse);
  rpc UpdateApplication(UpdateCareerApplicationRequest) returns (CareerApplicationResponse);
  /// Email a reviewed draft from the admin's mailbox, resume attached as PDF.
  rpc SendApplication(CareerApplicationRequest) returns (CareerApplicationResponse);
  /// The master resume (no application id) or a tailored one as a PDF.
  rpc RenderResumePdf(RenderResumeRequest) returns (ResumePdfResponse);

  rpc ListBoards(CareerAdminRequest) returns (CareerBoardsResponse);
  rpc AddBoard(AddCareerBoardRequest) returns (CareerBoardsResponse);
  rpc RemoveBoard(RemoveCareerBoardRequest) returns (CareerBoardsResponse);
}

message CareerAdminRequest {
  string admin_id = 1;
}

message CareersStatusResponse {
  bool claude_configured = 1;
  bool mail_configured = 2;
  optional string mail_from = 3;
  int32 sent_today = 4;
  int32 daily_send_limit = 5;
  optional string last_synced_at = 6;
  int32 jobs = 7;
}

message CareerProfile {
  string full_name = 1;
  string email = 2;
  optional string phone = 3;
  optional string location = 4;
  repeated string links = 5;
  optional string headline = 6;
  string resume_markdown = 7;
  repeated string target_roles = 8;
  repeated string skills = 9;
  repeated string preferred_locations = 10;
  bool remote_only = 11;
  optional int32 min_salary_usd = 12;
  optional string signature = 13;
  optional string updated_at = 14;
}

message CareerProfileResponse {
  CareerProfile profile = 1;
}

message SaveCareerProfileRequest {
  string admin_id = 1;
  optional string full_name = 2;
  optional string email = 3;
  optional string phone = 4;
  optional string location = 5;
  repeated string links = 6;
  optional string headline = 7;
  optional string resume_markdown = 8;
  repeated string target_roles = 9;
  repeated string skills = 10;
  repeated string preferred_locations = 11;
  optional bool remote_only = 12;
  optional int32 min_salary_usd = 13;
  optional string signature = 14;
  /// Repeated fields can't say "not sent"; these say which lists to replace.
  bool set_links = 15;
  bool set_target_roles = 16;
  bool set_skills = 17;
  bool set_preferred_locations = 18;
}

message ImportResumeRequest {
  string admin_id = 1;
  bytes content = 2;
  string mime_type = 3;
  string file_name = 4;
}

message SyncJobsRequest {
  string admin_id = 1;
  /// Empty = every source
  repeated string sources = 2;
}

message SyncSourceResult {
  string source = 1;
  int32 fetched = 2;
  /// Software roles among them
  int32 kept = 3;
  int32 created = 4;
  optional string error = 5;
}

message SyncJobsResponse {
  repeated SyncSourceResult results = 1;
  int32 created = 2;
  int32 total = 3;
}

message CareerJob {
  string job_id = 1;
  string source = 2;
  string title = 3;
  string company = 4;
  optional string company_url = 5;
  optional string location = 6;
  bool remote = 7;
  optional string employment_type = 8;
  optional string salary = 9;
  string url = 10;
  optional string apply_url = 11;
  optional string apply_email = 12;
  /// A short excerpt in lists; the whole text from GetJob
  string description = 13;
  repeated string tags = 14;
  optional string posted_at = 15;
  string first_seen_at = 16;
  int32 keyword_score = 17;
  optional int32 fit_score = 18;
  /// STRONG | GOOD | STRETCH | POOR
  optional string fit_verdict = 19;
  optional string fit_summary = 20;
  repeated string strengths = 21;
  repeated string gaps = 22;
  /// NEW | SAVED | DISMISSED | APPLIED
  string status = 23;
  optional string analyzed_at = 24;
  optional string application_id = 25;
  optional string application_status = 26;
}

message ListCareerJobsRequest {
  string admin_id = 1;
  optional string search = 2;
  optional string source = 3;
  /// NEW | SAVED | DISMISSED | APPLIED; empty = everything but dismissed
  optional string status = 4;
  optional bool remote_only = 5;
  optional int32 min_score = 6;
  optional int32 posted_within_days = 7;
  optional bool analyzed_only = 8;
  optional string company = 9;
  /// SCORE (default) | FIT | NEWEST
  optional string sort = 10;
  int32 page = 11;
  int32 page_size = 12;
}

message CareerJobsResponse {
  repeated CareerJob jobs = 1;
  int32 total = 2;
}

message CareerJobRequest {
  string admin_id = 1;
  string job_id = 2;
}

message CareerJobResponse {
  CareerJob job = 1;
}

message SetCareerJobStatusRequest {
  string admin_id = 1;
  repeated string job_ids = 2;
  string status = 3;
}

message AnalyzeFitRequest {
  string admin_id = 1;
  repeated string job_ids = 2;
}

message ListHiringCompaniesRequest {
  string admin_id = 1;
  optional string search = 2;
  optional int32 posted_within_days = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message HiringCompany {
  string company = 1;
  optional string company_url = 2;
  int32 open_roles = 3;
  int32 remote_roles = 4;
  int32 best_score = 5;
  optional int32 best_fit = 6;
  optional string latest_posted_at = 7;
  repeated string sources = 8;
  repeated string titles = 9;
  /// Any address a posting gave to apply to
  optional string apply_email = 10;
}

message HiringCompaniesResponse {
  repeated HiringCompany companies = 1;
  int32 total = 2;
}

message CareerApplication {
  string application_id = 1;
  string job_id = 2;
  optional string to_email = 3;
  string subject = 4;
  string body = 5;
  string cover_letter = 6;
  string resume_markdown = 7;
  /// DRAFT | SENT | FAILED | APPLIED_EXTERNALLY | INTERVIEW | OFFER | REJECTED | NO_REPLY
  string status = 8;
  optional string error = 9;
  optional string notes = 10;
  optional string sent_at = 11;
  string created_at = 12;
  string updated_at = 13;
  CareerJob job = 14;
}

message DraftApplicationRequest {
  string admin_id = 1;
  string job_id = 2;
  optional string to_email = 3;
  /// Anything to stress or mention, e.g. a referral or a project to lead with
  optional string instructions = 4;
}

message ListCareerApplicationsRequest {
  string admin_id = 1;
  optional string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message CareerApplicationsResponse {
  repeated CareerApplication applications = 1;
  int32 total = 2;
}

message UpdateCareerApplicationRequest {
  string admin_id = 1;
  string application_id = 2;
  optional string to_email = 3;
  optional string subject = 4;
  optional string body = 5;
  optional string cover_letter = 6;
  optional string resume_markdown = 7;
  optional string status = 8;
  optional string notes = 9;
}

message CareerApplicationRequest {
  string admin_id = 1;
  string application_id = 2;
}

message CareerApplicationResponse {
  CareerApplication application = 1;
}

message RenderResumeRequest {
  string admin_id = 1;
  optional string application_id = 2;
}

message ResumePdfResponse {
  string file_name = 1;
  bytes content = 2;
}

message CareerBoard {
  string board_id = 1;
  /// GREENHOUSE | LEVER | ASHBY
  string ats = 2;
  string slug = 3;
  string name = 4;
  bool active = 5;
  optional string last_synced_at = 6;
  optional string last_error = 7;
  int32 open_roles = 8;
}

message AddCareerBoardRequest {
  string admin_id = 1;
  string ats = 2;
  /// The board name, or a careers-page URL to read it from
  string slug = 3;
  optional string name = 4;
}

message RemoveCareerBoardRequest {
  string admin_id = 1;
  string board_id = 2;
}

message CareerBoardsResponse {
  repeated CareerBoard boards = 1;
}
