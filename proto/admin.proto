}

message UserRole {
  string user_role_id = 1;
  string role_name = 2;
  bool is_active = 3;
}



enum SendOtpType {
  REGISTRATION = 0;
  SIGNIN = 1;
  ADMIN_REGISTRATION = 2;
  ADMIN_SIGNIN = 3;
  FORGOT_PASSWORD = 4;
}

