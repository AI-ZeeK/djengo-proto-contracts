syntax = "proto3";

package files;

// 📁 Files Service - handles file uploads, storage, and management
service FilesService {

  rpc VerifyFile(VerifyFileRequest) returns (VerifyFileResponse);
  // Get all files for an entity and types (e.g. staff documents)
  rpc GetFilesByEntity(GetFilesByEntityRequest) returns (GetFilesByEntityResponse);


  rpc CreateOrUpdateFile(CreateOrUpdateFileRequest) returns (CreateOrUpdateFileResponse);
  // Temporary Upload System (Two-Phase)
  rpc UploadTemporaryFile(UploadTemporaryFileRequest) returns (TempFileResponse);
  rpc ConfirmFile(ConfirmFileRequest) returns (ConfirmFileResponse);
  rpc GetTempFile(GetTempFileRequest) returns (TempFileResponse);
  rpc GetTempFilesByUser(GetTempFilesByUserRequest) returns (GetTempFilesResponse);
  
  // Direct Upload (Original)
  rpc UploadFile(UploadFileRequest) returns (FileUploadResponse);
  rpc UploadMultipleFiles(UploadMultipleFilesRequest) returns (MultipleFileUploadResponse);
  
  // Upload Sessions (Batch)
  rpc CreateUploadSession(CreateUploadSessionRequest) returns (UploadSessionResponse);
  rpc ConfirmUploadSession(ConfirmUploadSessionRequest) returns (ConfirmUploadSessionResponse);
  rpc GetUploadSession(GetUploadSessionRequest) returns (UploadSessionResponse);
  
  // File Management
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc GetFileInfo(GetFileInfoRequest) returns (FileInfoResponse);
  rpc GetUserFiles(GetUserFilesRequest) returns (GetUserFilesResponse);
  
  // File Processing Status
  rpc GetProcessingStatus(GetProcessingStatusRequest) returns (ProcessingStatusResponse);
  rpc RetryProcessing(RetryProcessingRequest) returns (RetryProcessingResponse);
}


  // Get all files for an entity and a set of types
  message GetFilesByEntityRequest {
    string entity_id = 1;
    repeated string entity_types = 2;
  }

  message GetFilesByEntityResponse {
    repeated File files = 1;
  }

  message EntityFile {
    string type = 1;
    string url = 2;
  }

// 📝 REQUEST MESSAGES

message VerifyFileRequest {
  string entity_type = 1;
  string entity_id = 2;
}

message CreateOrUpdateFileRequest {
  string entity_type = 1;
  string entity_id = 2;
  string file_url = 3;
}

message CreateOrUpdateFileResponse {
  string file_url = 1;
}

message VerifyFileResponse {
  string file_url = 1;
}

message UploadTemporaryFileRequest {
  bytes file_data = 1;
  string file_name = 2;
  string mime_type = 3;
  string user_id = 4;
  optional string metadata = 5; // JSON string
  optional string session_id = 6;
}

message ConfirmFileRequest {
  string file_id = 1;
  string user_id = 2;
  optional string additional_metadata = 3; // JSON string
}

message GetTempFileRequest {
  string file_id = 1;
}

message GetTempFilesByUserRequest {
  string user_id = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
}

message UploadFileRequest {
  bytes file_data = 1;
  string file_name = 2;
  string mime_type = 3;
  string user_id = 4;
  optional string metadata = 5; // JSON string
}

message UploadMultipleFilesRequest {
  repeated FileUploadData files = 1;
  string user_id = 2;
  optional string metadata = 3; // JSON string
  optional bool temporary = 4; // default true
  optional string session_id = 5;
}

message FileUploadData {
  bytes file_data = 1;
  string file_name = 2;
  string mime_type = 3;
}

message CreateUploadSessionRequest {
  string user_id = 1;
  int32 expected_files = 2;
  optional int32 expires_in_minutes = 3; // default 30
}

message ConfirmUploadSessionRequest {
  string session_id = 1;
  string user_id = 2;
  repeated string files_to_keep = 3;
}

message GetUploadSessionRequest {
  string session_id = 1;
  string user_id = 2;
}

message DeleteFileRequest {
  string file_url = 1;
  string user_id = 2;
}

message GetFileInfoRequest {
  string file_id = 1;
  string user_id = 2;
}

message GetUserFilesRequest {
  string user_id = 1;
  optional FileType file_type = 2;
  optional int32 limit = 3;
  optional int32 offset = 4;
}

message GetProcessingStatusRequest {
  string file_id = 1;
  string user_id = 2;
}

message RetryProcessingRequest {
  string file_id = 1;
  string user_id = 2;
}

// 📤 RESPONSE MESSAGES

message TempFileResponse {
  bool success = 1;
  optional string error = 2;
  optional string file_url = 3;
}

message GetTempFilesResponse {
  bool success = 1;
  optional string error = 2;
  repeated TempFile temp_files = 3;
  int32 total_count = 4;
}

message ConfirmFileResponse {
  bool success = 1;
  optional string error = 2;
  optional string permanent_file_id = 3;
  optional string file_name = 4;
  optional string cloudinary_url = 5;
  optional FileType file_type = 6;
  optional string upload_job_id = 7;
}

message FileUploadResponse {
  bool success = 1;
  optional string error = 2;
  optional string file_id = 3;
  optional string file_name = 4;
  optional string cloudinary_url = 5;
  optional FileType file_type = 6;
  optional string upload_job_id = 7;
}

message MultipleFileUploadResponse {
  bool success = 1;
  optional string error = 2;
  repeated FileUploadResult results = 3;
  int32 total_files = 4;
  int32 successful_uploads = 5;
}

message FileUploadResult {
  bool success = 1;
  optional string error = 2;
  optional string file_id = 3;
  optional string file_name = 4;
  optional string cloudinary_url = 5;
  optional FileType file_type = 6;
  optional TempFileStatus status = 7;
  optional string expires_at = 8;
  optional string uploaded_at = 9;
}

message UploadSessionResponse {
  bool success = 1;
  optional string error = 2;
  optional UploadSession session = 3;
}

message ConfirmUploadSessionResponse {
  bool success = 1;
  optional string error = 2;
  optional string session_id = 3;
  repeated ConfirmFileResponse confirmed_files = 4;
  repeated string deleted_files = 5;
  optional UploadSessionStatus status = 6;
}

message DeleteFileResponse {
  bool success = 1;
  optional string error = 2;
  string message = 3;
}

message FileInfoResponse {
  bool success = 1;
  optional string error = 2;
  optional FileInfo file_info = 3;
}

message GetUserFilesResponse {
  bool success = 1;
  optional string error = 2;
  repeated FileInfo files = 3;
  int32 total_count = 4;
}

message ProcessingStatusResponse {
  bool success = 1;
  optional string error = 2;
  optional ProcessingStatus status = 3;
  optional string processing_error = 4;
  optional int32 progress_percentage = 5;
}

message RetryProcessingResponse {
  bool success = 1;
  optional string error = 2;
  optional string job_id = 3;
  string message = 4;
}

// 🏗️ DATA MODELS

message TempFile {
  string file_id = 1;
  string user_id = 2;
  string file_name = 3;
  int64 file_size = 4;
  string mime_type = 5;
  FileType file_type = 6;
  string cloudinary_url = 7;
  TempFileStatus status = 8;
  optional string metadata = 9; // JSON string
  optional string session_id = 10;
  string expires_at = 11;
  string created_at = 12;
  string updated_at = 13;
}

message UploadSession {
  string session_id = 1;
  string user_id = 2;
  int32 expected_files = 3;
  int32 uploaded_files = 4;
  UploadSessionStatus status = 5;
  optional string upload_token = 6;
  optional string metadata = 7; // JSON string
  string expires_at = 8;
  string created_at = 9;
  string updated_at = 10;
}

message FileInfo {
  string file_id = 1;
  string file_name = 2;
  string original_name = 3;
  int64 file_size = 4;
  FileType file_type = 5;
  string mime_type = 6;
  string file_url = 7;
  optional string thumbnail_url = 8;
  optional string compressed_url = 9;
  bool is_processed = 10;
  ProcessingStatus processing_status = 11;
  optional string processing_error = 12;
  FileVisibility visibility = 13;
  // int32 download_count = 14;
  int32 view_count = 15;
  bool is_public = 16;
  string uploaded_by = 17;
  optional string company_id = 18;
  optional string branch_id = 19;
  optional string entity_type = 20;
  optional string entity_id = 21;
  optional string alt_text = 22;
  optional string description = 23;
  repeated string tags = 24;
  optional string metadata = 25; // JSON string
  string created_at = 26;
  string updated_at = 27;
  optional string deleted_at = 28;
}

message EntityType {
  string entity_type_id = 1;
  string  entity_type = 2;
  optional string description = 3;
}
message File {
  string file_id = 1;
  string file_name = 2;
  int64 file_size = 3;
  string file_type = 4;
  string mime_type = 5;
  string file_url = 6;
  string uploaded_by_user_id = 7;
  optional string entity_id = 8;
  optional string branch_id = 9;
  EntityType entity_type = 10;
  optional string description = 11;
  optional string metadata = 12; // JSON string
  string created_at = 13;
  string updated_at = 14;
  optional string deleted_at = 15;
}

// 🏷️ ENUMS

enum FileType {
  FILE_TYPE_IMAGE = 0;
  FILE_TYPE_VIDEO = 1;
  FILE_TYPE_AUDIO = 2;
}

enum TempFileStatus {
  TEMP_FILE_STATUS_TEMPORARY = 0;
  TEMP_FILE_STATUS_CONFIRMING = 1;
  TEMP_FILE_STATUS_EXPIRED = 2;
  TEMP_FILE_STATUS_FAILED = 3;
}

enum UploadSessionStatus {
  UPLOAD_SESSION_STATUS_ACTIVE = 0;
  UPLOAD_SESSION_STATUS_CONFIRMING = 1;
  UPLOAD_SESSION_STATUS_COMPLETED = 2;
  UPLOAD_SESSION_STATUS_EXPIRED = 3;
  UPLOAD_SESSION_STATUS_CANCELLED = 4;
}

enum ProcessingStatus {
  PROCESSING_STATUS_PENDING = 0;
  PROCESSING_STATUS_PROCESSING = 1;
  PROCESSING_STATUS_COMPLETED = 2;
  PROCESSING_STATUS_FAILED = 3;
  PROCESSING_STATUS_CANCELLED = 4;
}

enum FileVisibility {
  FILE_VISIBILITY_PUBLIC = 0;
  FILE_VISIBILITY_PRIVATE = 1;
  FILE_VISIBILITY_ORGANIZATION = 2;
  FILE_VISIBILITY_BRANCH = 3;
  FILE_VISIBILITY_ROLE_RESTRICTED = 4;
}



// ── Document signing ─────────────────────────────────────────────────────
// Place fields on a document, collect signatures in order, export a sealed PDF.
// Field positions are PDF points on the page as displayed (top-left origin,
// page rotation applied), the same space as a pdf.js viewport at scale 1.

service SigningService {
  /// Creates a DRAFT envelope; the file is converted to a signable PDF and stored.
  rpc CreateEnvelope(CreateEnvelopeRequest) returns (EnvelopeResponse);
  /// Edits a DRAFT envelope (title, order, recipients, fields).
  rpc UpdateEnvelope(UpdateEnvelopeRequest) returns (EnvelopeResponse);
  rpc SendEnvelope(EnvelopeActionRequest) returns (EnvelopeResponse);
  rpc VoidEnvelope(EnvelopeActionRequest) returns (EnvelopeResponse);
  rpc GetEnvelope(GetEnvelopeRequest) returns (EnvelopeResponse);
  /// Latest envelope that isn't voided for a contract, booking document…
  rpc GetEnvelopeBySource(GetEnvelopeBySourceRequest) returns (EnvelopeResponse);
  rpc RecordEnvelopeView(SignerActionRequest) returns (EnvelopeResponse);
  /// One recipient signs. When the last one signs, the sealed PDF is produced.
  rpc SignEnvelope(SignEnvelopeRequest) returns (EnvelopeResponse);
  rpc DeclineEnvelope(SignerActionRequest) returns (EnvelopeResponse);
  /// Reusable layouts for documents sent many times (e.g. a booking agreement).
  rpc PrepareSigningTemplate(PrepareSigningTemplateRequest) returns (SigningTemplateResponse);
  rpc SaveSigningTemplate(SaveSigningTemplateRequest) returns (SigningTemplateResponse);
  rpc GetSigningTemplate(GetSigningTemplateRequest) returns (SigningTemplateResponse);
}

message SigningRecipientInput {
  /// EMPLOYEE, EMPLOYER, GUEST, COMPANY…; unique per envelope.
  string role = 1;
  /// USER (only user_id signs) or COMPANY (any authorized member of the company).
  string signer_kind = 2;
  optional string user_id = 3;
  string name = 4;
  optional string email = 5;
  int32 routing_order = 6;
}

message SigningFieldInput {
  string role = 1;
  /// SIGNATURE | INITIALS | DATE_SIGNED | FULL_NAME | TEXT | CHECKBOX
  string type = 2;
  /// 1-based.
  int32 page = 3;
  double x = 4;
  double y = 5;
  double width = 6;
  double height = 7;
  bool required = 8;
  optional string label = 9;
}

message CreateEnvelopeRequest {
  string company_id = 1;
  optional string organization_id = 2;
  /// employment_contract | engagement_document
  string source_type = 3;
  string source_id = 4;
  string title = 5;
  /// A file stored by this service (temp or permanent upload).
  string file_url = 6;
  string created_by = 7;
  optional string created_by_name = 8;
  bool sequential = 9;
  repeated SigningRecipientInput recipients = 10;
  repeated SigningFieldInput fields = 11;
  /// Copy fields from this template when it was laid out on the same file.
  optional string template_source_type = 12;
  optional string template_source_id = 13;
  /// Void an open envelope for the same source instead of refusing.
  bool replace_existing = 14;
  optional string company_name = 15;
}

message UpdateEnvelopeRequest {
  string envelope_id = 1;
  string company_id = 2;
  string actor_user_id = 3;
  optional string actor_name = 4;
  optional string title = 5;
  optional bool sequential = 6;
  /// The lists below replace what's stored only when their flag is set.
  bool replace_recipients = 7;
  repeated SigningRecipientInput recipients = 8;
  bool replace_fields = 9;
  repeated SigningFieldInput fields = 10;
}

message EnvelopeActionRequest {
  string envelope_id = 1;
  string company_id = 2;
  string actor_user_id = 3;
  optional string actor_name = 4;
  optional string reason = 5;
  optional string ip = 6;
  optional string user_agent = 7;
}

message GetEnvelopeRequest {
  string envelope_id = 1;
}

message GetEnvelopeBySourceRequest {
  string source_type = 1;
  string source_id = 2;
}

message SignerActionRequest {
  string envelope_id = 1;
  string role = 2;
  string user_id = 3;
  optional string actor_name = 4;
  optional string reason = 5;
  optional string ip = 6;
  optional string user_agent = 7;
}

message SigningFieldValue {
  string field_id = 1;
  /// TEXT input, or "true"/"false" for CHECKBOX.
  string value = 2;
}

message SignEnvelopeRequest {
  string envelope_id = 1;
  string role = 2;
  string user_id = 3;
  string signed_name = 4;
  /// DRAW (signature_image) | TYPE (signature_text)
  string signature_method = 5;
  optional bytes signature_image = 6;
  optional string signature_text = 7;
  optional bytes initials_image = 8;
  optional string initials_text = 9;
  repeated SigningFieldValue values = 10;
  /// The signer agreed to sign electronically.
  bool consent = 11;
  optional string ip = 12;
  optional string user_agent = 13;
}

message SigningPageSize {
  double width = 1;
  double height = 2;
}

message SigningRecipient {
  string recipient_id = 1;
  string role = 2;
  string signer_kind = 3;
  optional string user_id = 4;
  string name = 5;
  optional string email = 6;
  int32 routing_order = 7;
  /// PENDING | SIGNED | DECLINED
  string status = 8;
  optional string viewed_at = 9;
  optional string signed_at = 10;
  optional string signed_name = 11;
  optional string signature_method = 12;
  optional string signature_image_url = 13;
  optional string signature_text = 14;
  optional string declined_at = 15;
  optional string decline_reason = 16;
  /// Pending, the envelope is out, and (in order) everyone before has signed.
  bool can_sign_now = 17;
}

message SigningField {
  string field_id = 1;
  string role = 2;
  string type = 3;
  int32 page = 4;
  double x = 5;
  double y = 6;
  double width = 7;
  double height = 8;
  bool required = 9;
  optional string label = 10;
  optional string value = 11;
  optional string filled_at = 12;
}

message SigningEvent {
  string event_id = 1;
  string action = 2;
  optional string role = 3;
  optional string actor_name = 4;
  optional string ip = 5;
  string created_at = 6;
}

message SigningEnvelope {
  string envelope_id = 1;
  string company_id = 2;
  optional string organization_id = 3;
  string source_type = 4;
  string source_id = 5;
  string title = 6;
  /// DRAFT | SENT | COMPLETED | DECLINED | VOIDED
  string status = 7;
  bool sequential = 8;
  /// The signable PDF (images are converted when the envelope is created).
  string original_file_url = 9;
  string original_sha256 = 10;
  repeated SigningPageSize page_sizes = 11;
  /// The stamped, certified and sealed PDF once everyone has signed.
  optional string completed_file_url = 12;
  optional string completed_sha256 = 13;
  string created_by = 14;
  string created_at = 15;
  optional string sent_at = 16;
  optional string completed_at = 17;
  optional string voided_at = 18;
  optional string void_reason = 19;
  repeated SigningRecipient recipients = 20;
  repeated SigningField fields = 21;
  repeated SigningEvent events = 22;
  optional string company_name = 23;
}

message EnvelopeResponse {
  bool success = 1;
  optional string message = 2;
  optional SigningEnvelope envelope = 3;
}

message PrepareSigningTemplateRequest {
  string company_id = 1;
  /// engagement_requirement | contract_template
  string source_type = 2;
  string source_id = 3;
  string file_url = 4;
  string updated_by = 5;
}

message SaveSigningTemplateRequest {
  string company_id = 1;
  string source_type = 2;
  string source_id = 3;
  string updated_by = 4;
  bool sequential = 5;
  repeated SigningRecipientInput roles = 6;
  repeated SigningFieldInput fields = 7;
}

message GetSigningTemplateRequest {
  string source_type = 1;
  string source_id = 2;
}

message SigningTemplate {
  string template_id = 1;
  string company_id = 2;
  string source_type = 3;
  string source_id = 4;
  /// The signable PDF the layout sits on.
  string file_url = 5;
  /// SHA-256 of the uploaded source file the layout belongs to.
  string file_sha256 = 6;
  repeated SigningPageSize page_sizes = 7;
  repeated SigningRecipientInput roles = 8;
  repeated SigningFieldInput fields = 9;
  bool sequential = 10;
  string updated_at = 11;
}

message SigningTemplateResponse {
  bool success = 1;
  optional string message = 2;
  optional SigningTemplate template = 3;
}
